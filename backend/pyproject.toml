[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniagent-backend"
version = "0.1.0"
description = "UNiAGENT - Production AI University Student Agent Backend"
authors = [{ name = "UNiAGENT Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "langgraph>=0.0.60",
    "langgraph-checkpoint-postgres>=1.0.0",
    "langgraph-checkpoint>=1.0.0",
    "openai>=1.25.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "alembic>=1.13.1",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
